[project]
name = "sap-config-automation"
version = "0.1.0"
description = "SAP GUI Configuration Automation - Plan/Apply pipeline with mock SAP (Config as Code)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
    "jsonschema>=4.20",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false
